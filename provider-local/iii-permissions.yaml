# Agent permissions for the provider-local worker.
# Spec: tech-specs/2026-06-agentic/llm-router.md section Security.
version: 1

rules:
  # Direct provider calls bypass the router's accounting, budgets, and retry
  # policy - never agent-callable. The router invokes these worker-to-worker.
  - '!provider::vllm::*'
  - '!provider::sglang::*'
  - '!provider::prisml::*'
  - '!provider::mistralrs::*'
